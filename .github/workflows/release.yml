name: release (manual fallback)

# DEPRECATED — tag-push trigger removed 2026-05-31.
#
# Why: per the seekmodo monorepo's .cursor/rules/deploy.mdc +
# AGENTS.md §1, GitHub Actions is not used for routine deploys. Each
# tag push of v*.*.* fired this workflow's full build + auto-PR
# pipeline (~3 GHA minutes including Python setup + zip build + the
# cross-repo PR open). The same end-result — a signed, manifested,
# downloadable connector zip live at
# https://seekmodo.com/plugins/seekmodo-zen-cart-v<X.Y.Z>.zip — is
# now produced operator-locally:
#
#   git tag v<X.Y.Z>
#   git push origin v<X.Y.Z>
#   python tools/build_release.py --auto-pr
#
# The auto-PR opens against numinix/seekmodo and lands on
# `services/marketing-site/public/plugins/`, which the seekmodo
# webhook already redeploys on push. So the *deployment* of the
# release is webhook-driven; only the artefact build is operator-
# local. **No GHA minutes are consumed for the routine release.**
#
# This workflow is retained as a `workflow_dispatch`-only emergency
# fallback for the case where an operator can't run
# tools/build_release.py from their workstation (e.g. ed25519 signing
# key unavailable locally) and needs GHA to build + sign + open the
# PR. The `SEEKMODO_PUBLISH_TOKEN` secret stays configured so this
# fallback works when invoked manually. It does NOT run on tag push.
#
# DO NOT re-enable the `on: push` tag trigger — see the seekmodo
# monorepo's .cursor/rules/deploy.mdc.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why is GHA fallback being used? Routine releases are operator-local via tools/build_release.py --auto-pr."
        required: false
        default: "manual operator dispatch — operator-local signing unavailable"

permissions:
  # GITHUB_TOKEN needs contents:write so the final
  # "Attach release artefacts" step can `gh release create` /
  # `gh release upload` against this connector repo. The cross-repo
  # PR + auto-merge into numinix/seekmodo is done via
  # SEEKMODO_PUBLISH_TOKEN (a PAT or fine-grained token with `repo`
  # scope on numinix/seekmodo) and is not affected by this block.
  contents: write

jobs:
  publish:
    name: build + publish (manual fallback)
    # Migrated to the self-hosted numinix-backup runner (mini PC) on 2026-06-03.
    # workflow_dispatch-only fallback; routine releases ship operator-locally
    # via tools/build_release.py --auto-pr. Reverting to ubuntu-latest if the
    # mini PC is offline is a one-line change.
    runs-on: [self-hosted, linux, x64, numinix-mini]
    timeout-minutes: 10
    steps:
      - name: Check out the connector repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION="$(git describe --tags --abbrev=0 || true)"
          if [ -z "$VERSION" ]; then
            echo "ERROR: no tag found; cannot resolve a version. Tag a release first (git tag vX.Y.Z && git push --tags) before invoking this manual fallback." >&2
            exit 2
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build zip + SHA-256 + signature
        run: |
          python tools/build_release.py
          ls -la dist/

      - name: Open + auto-merge publish PR into numinix/seekmodo
        env:
          SEEKMODO_PUBLISH_TOKEN: ${{ secrets.SEEKMODO_PUBLISH_TOKEN }}
        run: |
          if [ -z "$SEEKMODO_PUBLISH_TOKEN" ]; then
            echo "::error::SEEKMODO_PUBLISH_TOKEN secret is not set on this repo."
            echo "Add a PAT with 'repo' scope on numinix/seekmodo as the secret named SEEKMODO_PUBLISH_TOKEN."
            exit 1
          fi
          python tools/build_release.py --auto-pr

      - name: Attach release artefacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent — if the release was created via `gh release
          # create` at tag time it already exists; this just adds the
          # artefacts. If it doesn't exist, create it from the tag.
          if ! gh release view "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            gh release create "${{ steps.version.outputs.version }}" \
              --title "${{ steps.version.outputs.version }}" \
              --generate-notes
          fi
          gh release upload "${{ steps.version.outputs.version }}" \
            dist/*.zip dist/*.zip.sha256 dist/*.zip.sig --clobber
