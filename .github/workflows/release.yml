name: release (manual fallback)

# DEPRECATED — tag-push trigger removed 2026-05-31.
#
# Routine releases are operator-local: `python tools/build_release.py --auto-pr`
# (see numinix/seekmodo AGENTS.md §1). This workflow_dispatch fallback runs on
# the numinix-mini self-hosted runner when the operator cannot build locally.
#
# Requires repo secrets: SEEKMODO_PUBLISH_TOKEN, RELEASE_SIGNING_KEY (hex seed).
# Org secret RELEASE_SIGNING_KEY is shared across numinix/* connector repos.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why is GHA fallback being used? Routine releases are operator-local via tools/build_release.py --auto-pr."
        required: false
        default: "manual operator dispatch — operator-local signing unavailable"

permissions:
  contents: write

jobs:
  publish:
    name: build + publish (manual fallback)
    runs-on: [self-hosted, linux, x64, numinix-mini]
    timeout-minutes: 15
    steps:
      - name: Check out the connector repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: connector

      - name: Check out seekmodo monorepo (connector docs template)
        uses: actions/checkout@v4
        with:
          repository: numinix/seekmodo
          ref: main
          path: seekmodo
          token: ${{ secrets.SEEKMODO_PUBLISH_TOKEN }}

      - name: Resolve release version
        id: version
        working-directory: connector
        run: |
          VERSION="$(git describe --tags --abbrev=0 || true)"
          if [ -z "$VERSION" ]; then
            echo "ERROR: no tag found; tag vX.Y.Z and push --tags before invoking this fallback." >&2
            exit 2
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pyyaml
          if ! command -v gh >/dev/null 2>&1; then
            echo "Installing gh CLI (required for --auto-pr)..."
            sudo apt-get update -qq
            sudo apt-get install -y gh
          fi
          if ! command -v composer >/dev/null 2>&1; then
            echo "WARN: composer not on PATH; SDK vendoring may fail"
          fi
          gh --version

      - name: Check out seekmodo-php-sdk (deploy key)
        uses: actions/checkout@v4
        with:
          repository: numinix/seekmodo-php-sdk
          ref: main
          path: php-sdk
          ssh-key: ${{ secrets.PHP_SDK_DEPLOY_KEY }}

      - name: Build, sign, and publish to seekmodo.com
        working-directory: connector
        env:
          SEEKMODO_PUBLISH_TOKEN: ${{ secrets.SEEKMODO_PUBLISH_TOKEN }}
          SEEKMODO_MONOREPO_ROOT: ${{ github.workspace }}/seekmodo
          SEEKMODO_PHP_SDK_ROOT: ${{ github.workspace }}/php-sdk
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.SEEKMODO_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SEEKMODO_PUBLISH_TOKEN" ]; then
            echo "::error::SEEKMODO_PUBLISH_TOKEN secret is not set on this repo."
            exit 1
          fi
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY secret is not set (org or repo level hex ed25519 seed)."
            exit 1
          fi
          mkdir -p /tmp/sk
          if echo "$RELEASE_SIGNING_KEY" | grep -qE '^[0-9a-fA-F]{64}$'; then
            echo "$RELEASE_SIGNING_KEY" | xxd -r -p > /tmp/sk/release-signing.key
          else
            printf '%s' "$RELEASE_SIGNING_KEY" > /tmp/sk/release-signing.key
          fi
          chmod 600 /tmp/sk/release-signing.key
          export RELEASE_SIGNING_KEY_PATH=/tmp/sk/release-signing.key
          export COMPOSER_AUTH='{"github-oauth": {"github.com": "'"${SEEKMODO_PUBLISH_TOKEN}"'"}}'
          git config --global url."https://x-access-token:${SEEKMODO_PUBLISH_TOKEN}@github.com/".insteadOf "https://github.com/"
          python tools/build_release.py --auto-pr
          ls -la dist/

      - name: Attach release artefacts to the GitHub release
        working-directory: connector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            gh release create "${{ steps.version.outputs.version }}" \
              --title "${{ steps.version.outputs.version }}" \
              --generate-notes
          fi
          gh release upload "${{ steps.version.outputs.version }}" \
            dist/*.zip dist/*.zip.sha256 dist/*.zip.sig --clobber
